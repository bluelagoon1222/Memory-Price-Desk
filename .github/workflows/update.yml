name: update-memory-prices
on:
  schedule:
    - cron: '40 10 * * 1-5'   # 19:40 KST, after TrendForce's last DRAM session (18:10 Taipei)
    - cron: '0 22 * * *'      # 07:00 KST backup (stocks, weekly NAND tables)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch.py
      - name: commit
        run: |
          git config user.name "memory-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "data update"
          git pull --rebase -q || true
          git push
